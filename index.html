<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANAPANA</title>
    <link rel="stylesheet" href="index.css">
    
    <link rel="icon" type="image/x-icon" href="icon/glowing_crystal.png">
</head>
<body>
    <h1><strong>ANAPANA</strong></h1>
    <img src="medi.png" alt="meditation" id="medi-img">
    <audio src="main_start.mp3" id="start-audio"></audio>
    <audio src="meditation_song.mp3" id="medi-audio" loop></audio>
    <audio src="main_conclusion.mp3" id="conclude-audio"></audio>


    <br>
    <div id="error-message-wrapper">
        <p id="error-message"></p>
    </div>
    
    <div id="selection-wrapper">
        <select name="mins-selection" id="mins-selection">
                <option value="0"> None </option>
                <option value="1"> 1 Mins</option>
                <option value="5"> 5 Mins</option>
                <option value="10">10 Mins</option>
                <option value="15">15 Mins</option>
                <option value="20">20 Mins</option>
                <option value="30">30 Mins</option>
                <option value="40">40 Mins</option>
                <option value="50">50 Mins</option>
                <option value="60">1 Hour</option>
                <option value="120">2 Hours</option>
                <option value="180">3 Hours</option>
                <option value="240">4 Hours</option>
                <option value="300">5 Hours</option>
                <option value="360">6 Hours</option>
                <option value="420">7 Hours</option>
                <option value="480">8 Hours</option>
                <option value="540">9 Hours</option>
                <option value="600">10 Hours</option>
                <option value="660">11 Hours</option>
                <option value="720">12 Hours</option>
                <option value="780">13 Hours</option>
                <option value="840">14 Hours</option>
                <option value="900">15 Hours</option>
                <option value="960">16 Hours</option>
                <option value="1020">17 Hours</option>
                <option value="1080">18 Hours</option>
                <option value="1140">19 Hours</option>
                <option value="1200">20 Hours</option>
                <option value="1260">21 Hours</option>
                <option value="1320">22 Hours</option>
                <option value="1380">23 Hours</option>
                <option value="1440">24 Hours</option>
        </select>
    </div>

    <div id="button-wrapper">
        <button id="start-btn" onclick="Start()">Start</button>
        <button id="stop-btn" onclick="Stop()"> Stop </button>
    </div>

    <p id="dev-name">Developer: John Ko Ko</p>
    
    <script src="index.js"></script>
   
</body>
</html>
